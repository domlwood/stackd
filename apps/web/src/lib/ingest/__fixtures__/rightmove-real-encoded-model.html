owMap\":81},53.60136,-2.3179,0,15,\"APPROXIMATE_POINT\",true,[],2,1,{\"listingUpdateReason\":86},\"Added on 23/10/2026\",{\"tenureType\":88,\"yearsRemainingOnLease\":4,\"message\":4},\"LEASEHOLD\",\"Terraced\",[91,95,98,101],{\"title\":92,\"type\":93,\"primaryText\":89,\"secondaryText\":94,\"tooltipText\":94},\"PROPERTY TYPE\",\"PROPERTY_TYPE\",\"\",{\"title\":96,\"type\":96,\"primaryText\":97,\"secondaryText\":94,\"tooltipText\":94},\"BEDROOMS\",\"2\",{\"title\":99,\"type\":99,\"primaryText\":100,\"secondaryText\":94,\"tooltipText\":94},\"BATHROOMS\",\"1\",{\"title\":102,\"type\":102,\"primaryText\":103,\"secondaryText\":94,\"tooltipText\":94},\"SIZE\",\"Ask agent\",{\"description\":105},\"<p>For sale is this two-bedroom terraced house in Tottington, offering neutrally decorated accommodation with scope for further improvement and personalisation.</p><p>To the front is a well-sized reception room with grey fitted carpet, white walls and a large window, creating a bright main living space. An open staircase leads to the first floor, enhancing the sense of space. The kitchen sits to the rear, fitted with contemporary units, dark tiled splashbacks and flooring, and space for dining or additional storage. The ground-floor bathroom is accessed from the kitchen and includes a white suite with shower over bath.</p><p>Upstairs are two bedrooms, both carpeted and neutrally finished, ready for wardrobes and furnishings. The property has on-street parking and would benefit from some TLC, ideal for first-time buyers or investors seeking a home they can add value to.</p><p>Tottington Road is well placed for local amenities, with Tottington village offering independent shops, cafés and everyday services, and Bury town centre just a short bus ride away for major retailers, the famous Bury Market and leisure facilities. There are several schools in the vicinity, making this a practical location for families.</p><p>Public transport links are excellent, with regular bus services along Tottington Road into Bury Interchange, connecting with the Metrolink for tram services into Manchester, typically around 30–40 minutes in total. Road links via the A58 and M66 provide straightforward access across Greater Manchester.</p><p>Council tax band A and an EPC rating of D complete the picture of this sensibly sized home in a convenient Tottington setting.</p><p>For information on broadband or mobile coverage in the area, please visit checker.ofcom.org.uk. Should you require EV charging, we advise that you get clarification as to whether the property can support an EV charger. To know if there is a risk of flood at this property, please visit gov.uk/check-long-term-flood-risk. We have taken every care to ensure that the particulars listed are accurate; however, this cannot be guaranteed. Therefore, we advise that prior to a viewing, any potential tenants or buyers carry out research on the property and let us know if you have any queries we can help with.</p> EPC rating: D. Tenure: Leasehold,\",{\"branchDisplayName\":107,\"companyName\":108},\"Northwood, Wigan\",\"The Property Franchise Group\",{\"id\":1,\"prices\":2,\"address\":6,\"keyFeatures\":13,\"images\":20,\"location\":75,\"sizings\":82,\"bedrooms\":83,\"bathrooms\":84,\"listingHistory\":85,\"tenure\":87,\"propertySubType\":89,\"infoReelItems\":90,\"text\":104,\"customer\":106}]","encoding":"on"};</script>
